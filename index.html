<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5e Piercer Feat Dice Roller</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>" />

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 + ReactDOM -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Babel compiles the JSX below in the browser -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <noscript>This app requires JavaScript to run.</noscript>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // ---------- App info (shown in the About panel) ----------
    const APP_INFO = {
      author: 'Hunter Hearl',
      year: 2026,
      repoUrl: 'https://github.com/MacSax7/piercer-dice-roller', // e.g. 'https://github.com/yourname/piercer-roller' (adds a link in About)
    };

    // ---------- Theme colors ----------
    // Swap the color name for any Tailwind color (red, rose, orange, amber, emerald,
    // teal, sky, blue, indigo, violet, slate...) and adjust the shade number:
    // lower numbers are lighter and brighter, higher numbers are deeper and calmer.
    // "light" is used in light mode, "dark" in dark mode.
    const THEME = {
      hit: {
        light: 'bg-red-500', lightHover: 'hover:bg-red-600',
        dark: 'bg-red-900', darkHover: 'hover:bg-red-800',
      },
      crit: {
        light: 'bg-blue-500', lightHover: 'hover:bg-blue-600',
        dark: 'bg-blue-900', darkHover: 'hover:bg-blue-800',
      },
      // Highlight for the die Piercer rerolled (background + border)
      reroll: {
        light: 'bg-amber-100 border-amber-300',
        dark: 'bg-amber-800 border-amber-500',
      },
      weaponText: { light: 'text-blue-600', dark: 'text-blue-400' },
      poison: { light: 'bg-pink-500', dark: 'bg-rose-700', textLight: 'text-pink-600', textDark: 'text-rose-400' },
    };

    // Colors you can assign to extra damage sources in Settings
    const PALETTE = {
      green:   { label: 'Green',   light: 'bg-green-500',   dark: 'bg-green-700',   textLight: 'text-green-600',   textDark: 'text-green-400' },
      emerald: { label: 'Emerald', light: 'bg-emerald-500', dark: 'bg-emerald-700', textLight: 'text-emerald-600', textDark: 'text-emerald-400' },
      teal:    { label: 'Teal',    light: 'bg-teal-500',    dark: 'bg-teal-700',    textLight: 'text-teal-600',    textDark: 'text-teal-400' },
      sky:     { label: 'Sky',     light: 'bg-sky-500',     dark: 'bg-sky-700',     textLight: 'text-sky-600',     textDark: 'text-sky-400' },
      violet:  { label: 'Violet',  light: 'bg-violet-500',  dark: 'bg-violet-700',  textLight: 'text-violet-600',  textDark: 'text-violet-400' },
      purple:  { label: 'Purple',  light: 'bg-purple-500',  dark: 'bg-purple-700',  textLight: 'text-purple-600',  textDark: 'text-purple-400' },
      fuchsia: { label: 'Fuchsia', light: 'bg-fuchsia-500', dark: 'bg-fuchsia-700', textLight: 'text-fuchsia-600', textDark: 'text-fuchsia-400' },
      orange:  { label: 'Orange',  light: 'bg-orange-500',  dark: 'bg-orange-700',  textLight: 'text-orange-600',  textDark: 'text-orange-400' },
    };

    const DAMAGE_TYPES = ['acid', 'bludgeoning', 'cold', 'fire', 'force', 'lightning', 'necrotic', 'piercing', 'poison', 'psychic', 'radiant', 'slashing', 'thunder'];
    const DIE_OPTIONS = [4, 6, 8, 10, 12];

    // ---------- Storage (Claude artifact storage if present, otherwise browser localStorage) ----------
    const STORAGE_KEY = 'piercer-settings';

    const settingsStore = {
      available() {
        if (window.storage) return true;
        try {
          const k = '__piercer_test__';
          window.localStorage.setItem(k, k);
          window.localStorage.removeItem(k);
          return true;
        } catch (err) {
          return false;
        }
      },
      async get() {
        if (window.storage) {
          const result = await window.storage.get(STORAGE_KEY, false);
          return result ? result.value : null;
        }
        return window.localStorage.getItem(STORAGE_KEY);
      },
      async set(value) {
        if (window.storage) {
          const result = await window.storage.set(STORAGE_KEY, value, false);
          return !!result;
        }
        window.localStorage.setItem(STORAGE_KEY, value);
        return true;
      },
    };

    const STORAGE_AVAILABLE = settingsStore.available();

    // ---------- Helpers ----------
    const rollDie = (sides) => Math.floor(Math.random() * sides) + 1;

    const toInt = (v, fallback = 0) => {
      const n = parseInt(v, 10);
      return isNaN(n) ? fallback : n;
    };

    const formatMod = (mod) => {
      const m = toInt(mod, 0);
      if (m === 0) return '';
      return m > 0 ? `+${m}` : `${m}`;
    };

    const capitalize = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : '');
    const nameOf = (item, fallback) => (item && item.name && item.name.trim()) || fallback;
    const makeId = (prefix) => `${prefix}-${Date.now()}-${Math.floor(Math.random() * 1000)}`;

    const weaponDice = (wp) => `${Math.max(1, toInt(wp.count, 1))}d${toInt(wp.die, 8)}${formatMod(wp.mod)}`;
    const diceStr = (cfg) => `${Math.max(0, toInt(cfg.count, 0))}d${toInt(cfg.die, 6)}`;

    // ---------- Settings ----------
    const SETTINGS_VERSION = 2;
    const WEAPON_DEFAULTS = { count: 1, die: 8, mod: 0, type: 'piercing', bonusAction: false };
    const EXTRA_DEFAULTS = { count: 1, die: 6, type: 'weapon', color: 'green', crit: true, frequency: 'once' };
    const POISON_DEFAULTS = { count: 1, die: 6, dc: 10, onSave: 'half' };

    const DEFAULT_SETTINGS = {
      version: SETTINGS_VERSION,
      attacksPerAction: 2,
      rerollThreshold: 50,
      weapons: [
        { id: 'rapier', name: 'Rapier', count: 1, die: 8, mod: 9, type: 'piercing', bonusAction: true },
        { id: 'dagger', name: 'Dagger', count: 1, die: 4, mod: 8, type: 'piercing', bonusAction: false },
        { id: 'lightXbow', name: 'Light Crossbow', count: 1, die: 8, mod: 6, type: 'piercing', bonusAction: false },
        { id: 'handXbow', name: 'Hand Crossbow', count: 1, die: 6, mod: 6, type: 'piercing', bonusAction: false },
      ],
      extras: [
        { id: 'sneak', name: 'Sneak Attack', count: 2, die: 6, type: 'weapon', color: 'green', crit: true, frequency: 'once' },
        { id: 'swarm', name: 'Swarm', count: 1, die: 6, type: 'piercing', color: 'green', crit: true, frequency: 'once' },
        { id: 'favored', name: 'Favored Foe', count: 1, die: 6, type: 'weapon', color: 'purple', crit: true, frequency: 'once' },
      ],
      poisons: [
        { id: 'poisoner', name: 'Poisoner Feat', count: 2, die: 8, dc: 14, onSave: 'none' },
      ],
    };

    // Upgrades saved settings from older versions so nothing has to be re-entered
    const migrateSettings = (saved) => {
      if (!saved || typeof saved !== 'object') return DEFAULT_SETTINGS;

      let weapons = saved.weapons;
      if (weapons && !Array.isArray(weapons)) {
        // Version 1 stored four fixed weapons by key; carry their dice and modifiers over
        weapons = DEFAULT_SETTINGS.weapons.map(w => {
          const old = saved.weapons[w.id];
          return old ? { ...w, die: old.die ?? w.die, mod: old.mod ?? w.mod } : w;
        });
      }

      let extras = saved.extras;
      if (extras && !Array.isArray(extras)) {
        // Version 1 stored three fixed extras by key; carry their dice over
        extras = DEFAULT_SETTINGS.extras.map(e => {
          const old = saved.extras[e.id];
          return old ? { ...e, count: old.count ?? e.count, die: old.die ?? e.die } : e;
        });
      }

      return {
        ...DEFAULT_SETTINGS,
        ...saved,
        version: SETTINGS_VERSION,
        weapons: Array.isArray(weapons) && weapons.length > 0 ? weapons.map(w => ({ ...WEAPON_DEFAULTS, ...w })) : DEFAULT_SETTINGS.weapons,
        extras: Array.isArray(extras) ? extras.map(e => ({ ...EXTRA_DEFAULTS, ...e })) : DEFAULT_SETTINGS.extras,
        poisons: Array.isArray(saved.poisons) && saved.poisons.length > 0 ? saved.poisons.map(p => ({ ...POISON_DEFAULTS, ...p })) : DEFAULT_SETTINGS.poisons,
      };
    };

    // ---------- Damage math (single source of truth for all totals) ----------
    const isPiercerDie = (d) => d.damageType === 'piercing';
    const sumDice = (dice) => dice.reduce((s, d) => s + d.value, 0);
    const poisonRaw = (attack) => sumDice(attack.dice.filter(d => d.source === 'poison'));
    const poisonDamage = (attack) => attack.poisonHalved ? Math.floor(poisonRaw(attack) / 2) : poisonRaw(attack);

    // Damage by type for one attack, e.g. { piercing: 21, poison: 4 }
    const attackBreakdown = (attack) => {
      const totals = {};
      const add = (type, n) => { totals[type] = (totals[type] || 0) + n; };
      attack.dice.filter(d => d.source !== 'poison').forEach(d => add(d.damageType, d.value));
      if (attack.modifier) add(attack.weaponType, attack.modifier);
      if (attack.dice.some(d => d.source === 'poison')) add('poison', poisonDamage(attack));
      return totals;
    };
    const attackTotal = (attack) => Object.values(attackBreakdown(attack)).reduce((s, n) => s + n, 0);
    const totalOf = (attacks) => attacks.reduce((s, a) => s + attackTotal(a), 0);
    const breakdownOf = (attacks) => attacks.reduce((acc, a) => {
      Object.entries(attackBreakdown(a)).forEach(([t, n]) => { acc[t] = (acc[t] || 0) + n; });
      return acc;
    }, {});

    const calcExpectedImprovement = (value, sides) => (sides + 1) / 2 - value;
    const calcImprovementProbability = (value, sides) => Math.max(0, (sides - value) / sides * 100);

    // ---------- Color lookups ----------
    const dieTextColor = (die, darkMode) => {
      if (die.source === 'poison') return darkMode ? THEME.poison.textDark : THEME.poison.textLight;
      if (die.source === 'extra') {
        const p = PALETTE[die.color] || PALETTE.green;
        return darkMode ? p.textDark : p.textLight;
      }
      return darkMode ? THEME.weaponText.dark : THEME.weaponText.light;
    };

    const typeTextColor = (type, darkMode) => {
      if (type === 'piercing') return darkMode ? THEME.weaponText.dark : THEME.weaponText.light;
      if (type === 'poison') return darkMode ? THEME.poison.textDark : THEME.poison.textLight;
      return 'font-medium';
    };

    const typeRank = (t) => (t === 'piercing' ? 0 : t === 'poison' ? 2 : 1);
    const orderTypes = (types) => [...types].sort((a, b) => typeRank(a) - typeRank(b) || a.localeCompare(b));

    // ---------- Components ----------
    const DieResult = ({ die, isRerolled, originalValue, darkMode, selectable, onSelect, showStats }) => {
      const bgColor = isRerolled
        ? THEME.reroll[darkMode ? 'dark' : 'light']
        : (darkMode ? 'bg-gray-700 border-gray-500' : 'bg-white border-slate-300');
      const textColor = dieTextColor(die, darkMode);
      const eligible = isPiercerDie(die);

      const improvementProb = calcImprovementProbability(die.value, die.sides);
      const getProbColor = () => {
        if (improvementProb <= 10) return darkMode ? 'text-red-400' : 'text-red-600';
        if (improvementProb <= 50) return darkMode ? 'text-yellow-400' : 'text-yellow-600';
        return darkMode ? 'text-green-400' : 'text-green-600';
      };

      return (
        <div
          className={`inline-flex flex-col items-center p-2 rounded border-2 ${bgColor} ${selectable ? 'cursor-pointer hover:border-amber-500 hover:scale-105 transition-transform' : ''}`}
          onClick={selectable ? onSelect : undefined}
        >
          <span className={`text-xs mb-1 ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>{die.label}</span>
          <div className="flex items-center gap-1">
            {isRerolled && (
              <>
                <span className="text-lg text-red-400 line-through">{originalValue}</span>
                <span className={darkMode ? 'text-gray-500' : 'text-gray-400'}>→</span>
              </>
            )}
            <span className={`text-xl font-bold ${textColor}`}>{die.value}</span>
          </div>
          <span className={`text-xs ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>d{die.sides}</span>
          {!eligible && <span className={`text-xs ${textColor}`}>({die.damageType})</span>}
          {showStats && eligible && (
            <div className={`text-xs mt-1 ${getProbColor()}`}>{improvementProb.toFixed(0)}% to improve</div>
          )}
        </div>
      );
    };

    const AttackRow = ({ attack, rerolledIndex, originalValue, globalStartIndex, darkMode, selectMode, onSelectDie, showStats }) => {
      const subtotal = attackTotal(attack);
      const mod = attack.modifier;

      return (
        <div className={`flex flex-wrap items-center gap-1 py-2 border-b last:border-b-0 ${darkMode ? 'border-gray-600' : 'border-slate-300'}`}>
          <div className={`w-full text-sm font-medium mb-1 ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>{attack.label}</div>
          <div className="flex flex-wrap items-center gap-1 flex-1">
            {attack.dice.map((die, idx) => {
              const globalIdx = globalStartIndex + idx;
              return (
                <DieResult
                  key={idx}
                  die={die}
                  isRerolled={globalIdx === rerolledIndex}
                  originalValue={originalValue}
                  darkMode={darkMode}
                  selectable={selectMode && isPiercerDie(die)}
                  onSelect={() => onSelectDie(globalIdx)}
                  showStats={showStats}
                />
              );
            })}
            {mod !== 0 && (
              <div className={`inline-flex items-center px-2 py-1 font-medium ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>
                {mod > 0 ? `+${mod}` : `−${Math.abs(mod)}`}
              </div>
            )}
            {attack.poisonHalved && (
              <div className={`inline-flex items-center px-2 py-1 text-xs font-medium ${darkMode ? THEME.poison.textDark : THEME.poison.textLight}`}>
                Poison saved: {poisonRaw(attack)} → {poisonDamage(attack)} (½)
              </div>
            )}
          </div>
          <div className={`text-lg font-bold ml-auto pl-4 ${darkMode ? 'text-gray-200' : 'text-gray-700'}`}>
            = {subtotal}
          </div>
        </div>
      );
    };

    function PiercerDiceRoller() {
      const [view, setView] = useState('roller');
      const [showAbout, setShowAbout] = useState(false);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [settingsLoaded, setSettingsLoaded] = useState(false);
      const [saveStatus, setSaveStatus] = useState('idle');
      const [confirmReset, setConfirmReset] = useState(false);
      const skipFirstSave = useRef(true);

      const [mainId, setMainId] = useState(DEFAULT_SETTINGS.weapons[0].id);
      const [mixId, setMixId] = useState('none');
      const [mixTotal, setMixTotal] = useState(0);
      const [mixCrits, setMixCrits] = useState(0);
      const [bonusId, setBonusId] = useState('');
      const [bonusResult, setBonusResult] = useState('none');
      const [activeExtras, setActiveExtras] = useState({});
      const [poisonOn, setPoisonOn] = useState(false);
      const [selectedPoisonId, setSelectedPoisonId] = useState(DEFAULT_SETTINGS.poisons[0].id);
      const [poisonSave, setPoisonSave] = useState('fail');
      const [results, setResults] = useState(null);
      const [pendingReroll, setPendingReroll] = useState(null);
      const [rollLog, setRollLog] = useState([]);
      const [darkMode, setDarkMode] = useState(() => window.matchMedia('(prefers-color-scheme: dark)').matches);

      useEffect(() => {
        const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        const handleChange = (e) => setDarkMode(e.matches);
        mediaQuery.addEventListener('change', handleChange);
        return () => mediaQuery.removeEventListener('change', handleChange);
      }, []);

      // Match the page background and native controls to the current theme
      useEffect(() => {
        document.body.style.backgroundColor = darkMode ? '#111827' : '#f1f5f9';
        document.documentElement.style.colorScheme = darkMode ? 'dark' : 'light';
      }, [darkMode]);

      // Close the About panel with the Escape key
      useEffect(() => {
        if (!showAbout) return;
        const onKey = (e) => { if (e.key === 'Escape') setShowAbout(false); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [showAbout]);

      // Load saved settings once (upgrading older formats)
      useEffect(() => {
        const load = async () => {
          try {
            const raw = await settingsStore.get();
            if (raw) setSettings(migrateSettings(JSON.parse(raw)));
          } catch (err) {
            // No saved settings yet; defaults are used
          } finally {
            setSettingsLoaded(true);
          }
        };
        load();
      }, []);

      // Auto-save settings (debounced) after they've loaded
      useEffect(() => {
        if (!settingsLoaded || !STORAGE_AVAILABLE) return;
        if (skipFirstSave.current) {
          skipFirstSave.current = false;
          return;
        }
        setSaveStatus('saving');
        const t = setTimeout(async () => {
          try {
            const ok = await settingsStore.set(JSON.stringify(settings));
            setSaveStatus(ok ? 'saved' : 'error');
          } catch (err) {
            setSaveStatus('error');
          }
        }, 600);
        return () => clearTimeout(t);
      }, [settings, settingsLoaded]);

      // ---------- Derived turn setup ----------
      const weapons = settings.weapons;
      const A = Math.min(4, Math.max(1, toInt(settings.attacksPerAction, 2)));
      const threshold = Math.min(100, Math.max(0, toInt(settings.rerollThreshold, 50)));

      const main = weapons.find(w => w.id === mainId) || weapons[0];
      const mix = mixId !== 'none' ? (weapons.find(w => w.id === mixId && w.id !== main.id) || null) : null;
      const mTotal = mix ? Math.min(mixTotal, A) : 0;
      const mCrits = Math.min(mixCrits, mTotal);

      // A bonus-action weapon used as the main weapon adds one attack to its own grid;
      // otherwise any bonus-action weapon can be added from the Bonus Action row.
      const mainHasBonus = !!main.bonusAction;
      const bonusOptions = mainHasBonus ? [] : weapons.filter(w => w.bonusAction && w.id !== main.id);
      const bonusWeapon = bonusOptions.find(w => w.id === bonusId) || bonusOptions[0] || null;
      const bResult = bonusWeapon ? bonusResult : 'none';

      const mainMax = (A - mTotal) + (mainHasBonus ? 1 : 0);
      const mainStart = (mTotal > 0 || bResult !== 'none') ? 0 : 1;

      const selectedPoison = settings.poisons.find(p => p.id === selectedPoisonId) || settings.poisons[0];

      const selectMain = (id) => {
        setMainId(id);
        setMixId('none');
        setMixTotal(0);
        setMixCrits(0);
        setBonusResult('none');
      };

      const selectMix = (id) => {
        setMixId(id);
        setMixTotal(0);
        setMixCrits(0);
      };

      // ---------- Settings updaters ----------
      const updateSetting = (field, value) => setSettings(s => ({ ...s, [field]: value }));
      const updateItem = (list, id, field, value) => setSettings(s => ({
        ...s,
        [list]: s[list].map(item => item.id === id ? { ...item, [field]: value } : item),
      }));
      const addItem = (list, item) => setSettings(s => ({ ...s, [list]: [...s[list], item] }));
      const removeItem = (list, id, min) => setSettings(s => (s[list].length <= min ? s : { ...s, [list]: s[list].filter(item => item.id !== id) }));

      const resetSettings = () => {
        setSettings(DEFAULT_SETTINGS);
        setSelectedPoisonId(DEFAULT_SETTINGS.poisons[0].id);
        selectMain(DEFAULT_SETTINGS.weapons[0].id);
        setActiveExtras({});
        setConfirmReset(false);
      };

      // ---------- Rolling logic ----------
      const formatHitLabel = (hits, crits) => {
        const total = hits + crits;
        if (total === 1 && crits === 1) return '1 Critical Hit';
        const hitWord = total === 1 ? 'Hit' : 'Hits';
        if (crits === 0) return `${total} ${hitWord}`;
        const critWord = crits === 1 ? 'Crit' : 'Crits';
        return `${total} ${hitWord} w/ ${crits} ${critWord}`;
      };

      const toggleExtra = (id) => setActiveExtras(prev => ({ ...prev, [id]: !prev[id] }));

      const addToLog = (attacks) => {
        const breakdown = breakdownOf(attacks);
        const logEntry = {
          id: Date.now(),
          total: Object.values(breakdown).reduce((s, n) => s + n, 0),
          breakdown,
          poisonHalved: attacks.some(a => a.poisonHalved),
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        };
        setRollLog(prev => [logEntry, ...prev].slice(0, 10));
      };

      const findOptimalReroll = (allDice) => {
        const eligibleDice = allDice.map((d, idx) => ({ ...d, idx })).filter(isPiercerDie);
        if (eligibleDice.length === 0) return { index: -1, reason: 'no-piercing', bestProb: 0 };

        let bestIdx = -1;
        let bestImprovement = -Infinity;
        let bestProb = 0;

        eligibleDice.forEach(d => {
          const improvement = calcExpectedImprovement(d.value, d.sides);
          if (improvement > bestImprovement) {
            bestImprovement = improvement;
            bestIdx = d.idx;
            bestProb = calcImprovementProbability(d.value, d.sides);
          }
        });

        if (bestImprovement <= 0) return { index: -1, reason: 'no-benefit', bestProb };
        return { index: bestIdx, reason: 'optimal', improvement: bestImprovement, bestProb };
      };

      // Adds a set of dice to an attack; "doubled" adds the crit copies
      const pushDice = (attack, { name, count, die, damageType, source, color }, doubled) => {
        const n = Math.max(0, toInt(count, 0));
        const sides = toInt(die, 6);
        const mk = (label) => ({ label, group: name, sides, value: rollDie(sides), damageType, source, color });
        for (let i = 0; i < n; i++) attack.dice.push(mk(n === 1 ? name : `${name} ${i + 1}`));
        if (doubled) {
          for (let i = 0; i < n; i++) attack.dice.push(mk(n === 1 ? `${name} Crit` : `${name} Crit ${i + 1}`));
        }
      };

      const makeWeaponAttack = (num, wp, isCrit, suffix = '') => {
        const name = nameOf(wp, 'Weapon');
        const type = wp.type || 'piercing';
        const attack = { label: `Attack ${num} (${name}${isCrit ? ' Crit' : ''}${suffix})`, dice: [], modifier: toInt(wp.mod, 0), weaponType: type };
        pushDice(attack, { name, count: Math.max(1, toInt(wp.count, 1)), die: wp.die, damageType: type, source: 'weapon' }, isCrit);
        // Piercer: a crit that deals piercing damage rolls one additional weapon die
        if (isCrit && type === 'piercing') {
          const sides = toInt(wp.die, 8);
          attack.dice.push({ label: 'Piercer Bonus', group: name, sides, value: rollDie(sides), damageType: type, source: 'weapon' });
        }
        return attack;
      };

      const addExtraDamage = (attack, isCrit, isFirst, wp) => {
        settings.extras.forEach(e => {
          if (!activeExtras[e.id]) return;
          if (e.frequency !== 'hit' && !isFirst) return;
          const damageType = e.type === 'weapon' ? (wp.type || 'piercing') : e.type;
          pushDice(attack, {
            name: nameOf(e, 'Extra Damage'), count: e.count, die: e.die, damageType, source: 'extra', color: e.color,
          }, isCrit && e.crit);
        });
        if (isFirst && poisonOn && selectedPoison) {
          const saved = poisonSave === 'save';
          if (!saved || selectedPoison.onSave === 'half') {
            // Poison is a saving-throw effect: never doubled on a crit, never Piercer-eligible
            pushDice(attack, { name: 'Poison', count: selectedPoison.count, die: selectedPoison.die, damageType: 'poison', source: 'poison' }, false);
            if (saved) attack.poisonHalved = true;
          }
        }
      };

      const rollDamage = (hits, crits) => {
        // Attack order: crits first so once-per-turn extra damage lands on a crit when one exists
        const plan = [];
        const repeat = (n, entry) => { for (let i = 0; i < n; i++) plan.push(entry); };

        if (mix) repeat(mCrits, { wp: mix, isCrit: true });
        repeat(crits, { wp: main, isCrit: true });
        if (bonusWeapon && bResult === 'crit') plan.push({ wp: bonusWeapon, isCrit: true, bonus: true });
        if (mix) repeat(mTotal - mCrits, { wp: mix, isCrit: false });
        repeat(hits, { wp: main, isCrit: false });
        if (bonusWeapon && bResult === 'hit') plan.push({ wp: bonusWeapon, isCrit: false, bonus: true });

        if (plan.length === 0) return;

        const attacks = plan.map((p, i) => {
          const attack = makeWeaponAttack(i + 1, p.wp, p.isCrit, p.bonus ? ' - Bonus' : '');
          addExtraDamage(attack, p.isCrit, i === 0, p.wp);
          return attack;
        });

        const allDice = attacks.flatMap(a => a.dice);
        const optimal = findOptimalReroll(allDice);

        if (optimal.bestProb > threshold && optimal.index >= 0) {
          const originalValue = allDice[optimal.index].value;
          allDice[optimal.index].value = rollDie(allDice[optimal.index].sides);
          setResults({ attacks, rerolledIndex: optimal.index, originalValue, total: totalOf(attacks), rerollReason: 'auto', autoRerolled: true });
          setPendingReroll(null);
          addToLog(attacks);
        } else if (optimal.reason === 'no-piercing') {
          // Nothing Piercer can reroll this turn
          setResults({ attacks, rerolledIndex: -1, originalValue: 0, total: totalOf(attacks), rerollReason: 'no-piercing', autoRerolled: false });
          setPendingReroll(null);
          addToLog(attacks);
        } else {
          setPendingReroll({ attacks, total: totalOf(attacks), reason: optimal.reason, bestProb: optimal.bestProb });
          setResults(null);
        }
      };

      const handleManualReroll = (dieIndex) => {
        if (!pendingReroll) return;
        const { attacks } = pendingReroll;
        const allDice = attacks.flatMap(a => a.dice);
        const originalValue = allDice[dieIndex].value;
        allDice[dieIndex].value = rollDie(allDice[dieIndex].sides);

        setResults({ attacks, rerolledIndex: dieIndex, originalValue, total: totalOf(attacks), rerollReason: 'manual', autoRerolled: false });
        setPendingReroll(null);
        addToLog(attacks);
      };

      const handleSkipReroll = () => {
        if (!pendingReroll) return;
        setResults({ attacks: pendingReroll.attacks, rerolledIndex: -1, originalValue: 0, total: pendingReroll.total, rerollReason: 'skipped', autoRerolled: false });
        setPendingReroll(null);
        addToLog(pendingReroll.attacks);
      };

      const getRerollMessage = () => {
        if (pendingReroll) {
          if (pendingReroll.reason === 'no-benefit') {
            return 'Piercer: No reroll is expected to improve damage. Click a die to gamble anyway, or skip:';
          }
          return `Piercer: Best chance to improve is ${pendingReroll.bestProb.toFixed(0)}%. Click a die to reroll, or skip:`;
        }
        if (!results) return '';
        if (results.rerollReason === 'skipped') return 'Piercer: Reroll skipped';
        if (results.rerollReason === 'no-piercing') return 'Piercer: No piercing damage dice to reroll this turn';
        if (results.rerolledIndex >= 0) {
          const die = results.attacks.flatMap(a => a.dice)[results.rerolledIndex];
          return `Piercer: ${results.autoRerolled ? 'Auto-rerolled' : 'Rerolled'} ${die.label} (${results.originalValue} → ${die.value})`;
        }
        return '';
      };

      // ---------- Shared styling ----------
      const mode = darkMode ? 'dark' : 'light';
      const hoverKey = darkMode ? 'darkHover' : 'lightHover';
      const unselectedBtnClass = darkMode ? 'bg-gray-700 text-gray-100' : 'bg-gray-200 text-gray-900';
      const unselectedHover = darkMode ? 'hover:bg-gray-600' : 'hover:bg-gray-300';
      const selectedHitClass = `${THEME.hit[mode]} text-white`;
      const selectedCritClass = `${THEME.crit[mode]} text-white`;
      const selectedNeutralClass = darkMode ? 'bg-indigo-500 text-white' : 'bg-gray-800 text-white';
      const noneSelectedClass = darkMode ? 'bg-gray-600 text-white' : 'bg-gray-800 text-white';
      const poisonSelectedClass = `${THEME.poison[mode]} text-white`;
      const cardClass = `border-2 rounded-lg p-4 ${darkMode ? 'border-gray-600 bg-gray-800' : 'border-slate-300 bg-slate-200'}`;
      const rowBorder = darkMode ? 'border-gray-600' : 'border-slate-300';
      const dividerClass = darkMode ? 'divide-gray-700' : 'divide-slate-300';
      const inputClass = `rounded border px-2 py-1 ${darkMode ? 'bg-gray-700 border-gray-600 text-gray-100' : 'bg-white border-slate-300 text-gray-900'}`;
      const subtleText = darkMode ? 'text-gray-400' : 'text-gray-600';
      const sectionLabelClass = 'block text-lg font-semibold mb-2';
      const subLabelClass = 'block text-sm font-medium mb-2';
      const weaponTextClass = THEME.weaponText[mode];
      const poisonTextClass = darkMode ? THEME.poison.textDark : THEME.poison.textLight;
      const totalTextClass = darkMode ? 'text-green-400' : 'text-green-600';
      const smallBtnClass = `px-2 py-1 rounded text-xs text-white ${darkMode ? 'bg-gray-600 hover:bg-gray-500' : 'bg-gray-400 hover:bg-gray-500'}`;

      const hitBtnClass = (crits) => {
        const c = crits > 0 ? THEME.crit : THEME.hit;
        return `${c[mode]} ${c[hoverKey]}`;
      };

      const renderHitGroups = (startTotal, maxTotal, onRoll, zeroLabel = '') => {
        const groups = [];
        for (let total = startTotal; total <= maxTotal; total++) {
          const btns = [];
          for (let crits = 0; crits <= total; crits++) {
            const hits = total - crits;
            btns.push(
              <button key={`${hits}-${crits}`}
                onClick={() => onRoll(hits, crits)}
                className={`rounded text-white p-3 font-medium ${hitBtnClass(crits)}`}>
                {total === 0 ? zeroLabel : formatHitLabel(hits, crits)}
              </button>
            );
            if (total === 0) break;
          }
          groups.push(<div key={total} className="grid grid-cols-2 gap-2 py-4 first:pt-0 last:pb-0">{btns}</div>);
        }
        return <div className={`flex flex-col max-w-xl divide-y ${dividerClass}`}>{groups}</div>;
      };

      // Render helpers (plain functions, not components, so inputs keep focus while typing)
      const field = (label, control) => (
        <label className={`flex flex-col gap-1 text-xs ${subtleText}`}>
          {label}
          {control}
        </label>
      );

      const renderDieSelect = (value, onChange) => (
        <select value={value} onChange={(e) => onChange(parseInt(e.target.value, 10))} className={`${inputClass} w-20`}>
          {DIE_OPTIONS.map(d => <option key={d} value={d}>d{d}</option>)}
        </select>
      );

      const renderNumberInput = (value, onChange, opts = {}) => (
        <input
          type="number"
          value={value}
          min={opts.min}
          max={opts.max}
          onChange={(e) => onChange(e.target.value === '' ? '' : parseInt(e.target.value, 10))}
          className={`${inputClass} ${opts.width || 'w-20'}`}
        />
      );

      const renderTextInput = (value, onChange) => (
        <input type="text" value={value} onChange={(e) => onChange(e.target.value)} className={`${inputClass} w-44`} />
      );

      const renderTypeSelect = (value, onChange, allowWeapon) => (
        <select value={value} onChange={(e) => onChange(e.target.value)} className={`${inputClass} w-40`}>
          {allowWeapon && <option value="weapon">Same as weapon</option>}
          {DAMAGE_TYPES.map(t => <option key={t} value={t}>{capitalize(t)}</option>)}
        </select>
      );

      const renderCheckbox = (checked, onChange, label) => (
        <label className="flex items-center gap-2 text-sm cursor-pointer">
          <input type="checkbox" checked={checked} onChange={(e) => onChange(e.target.checked)} className="w-4 h-4 accent-indigo-500" />
          {label}
        </label>
      );

      const renderSwatches = (value, onChange) => (
        <div className="flex items-center gap-2">
          <span className={`text-xs ${subtleText}`}>Color</span>
          {Object.entries(PALETTE).map(([key, p]) => (
            <button
              key={key}
              type="button"
              title={p.label}
              aria-label={p.label}
              aria-pressed={value === key}
              onClick={() => onChange(key)}
              className={`w-5 h-5 rounded-full ${p.light} ${value === key ? `ring-2 ring-offset-2 ${darkMode ? 'ring-gray-200 ring-offset-gray-800' : 'ring-gray-700 ring-offset-slate-200'}` : ''}`}
            />
          ))}
        </div>
      );

      const saveMessage = !STORAGE_AVAILABLE
        ? "Settings can't be saved in this browser (private browsing may block storage)"
        : !settingsLoaded ? 'Loading saved settings…'
        : saveStatus === 'saving' ? 'Saving…'
        : saveStatus === 'saved' ? '✓ Saved'
        : saveStatus === 'error' ? "Couldn't save; changes will last for this session only"
        : 'Changes save automatically';

      const poisonNote = poisonSave === 'fail'
        ? `Full damage (${diceStr(selectedPoison)})`
        : selectedPoison.onSave === 'half' ? 'Half damage, rounded down' : 'No poison damage on a successful save';

      const displayAttacks = pendingReroll?.attacks || results?.attacks;
      const isSelectMode = !!pendingReroll;

      const legendExtras = displayAttacks
        ? displayAttacks.flatMap(a => a.dice).filter(d => d.source === 'extra')
            .reduce((acc, d) => (acc.some(x => x.group === d.group) ? acc : [...acc, d]), [])
        : [];
      const hasPoisonDice = !!displayAttacks && displayAttacks.some(a => a.dice.some(d => d.source === 'poison'));

      const hitsHeader = (
        <label className={sectionLabelClass}>
          Hits / Crits <span className={`ml-1 text-sm font-normal ${subtleText}`}>Click to roll</span>
        </label>
      );

      return (
        <div className={`min-h-screen px-6 sm:px-10 lg:px-16 py-6 ${darkMode ? 'bg-gray-900 text-gray-100' : 'bg-slate-100 text-gray-900'}`}>
          <div className="max-w-4xl">
            <div className="flex justify-between items-start gap-4 mb-4">
              <div>
                <h1 className="text-3xl font-bold">5e Piercer Feat Dice Roller</h1>
                <p className={`text-sm mt-1 ${subtleText}`}>
                  Roll a full turn's damage in one tap, with the Piercer feat's once-per-turn reroll applied to the die most likely to improve.
                </p>
              </div>
              <button
                onClick={() => setDarkMode(!darkMode)}
                className={`shrink-0 px-3 py-1 rounded text-sm ${unselectedBtnClass} ${unselectedHover}`}
              >
                {darkMode ? '☀️ Light' : '🌙 Dark'}
              </button>
            </div>

            <div className="flex gap-2 mb-6">
              {[['roller', '🎲 Roller'], ['settings', '⚙️ Settings']].map(([key, label]) => (
                <button key={key} onClick={() => setView(key)}
                  className={`px-4 py-2 rounded font-medium ${view === key ? selectedNeutralClass : `${unselectedBtnClass} ${unselectedHover}`}`}>
                  {label}
                </button>
              ))}
            </div>

            {view === 'roller' && (
              <>
                <div className="mb-6">
                  <label className={sectionLabelClass}>Weapon</label>
                  <div className="flex flex-wrap gap-2">
                    {weapons.map(w => (
                      <button key={w.id} onClick={() => selectMain(w.id)}
                        className={`px-4 py-2 rounded ${main.id === w.id ? selectedNeutralClass : `${unselectedBtnClass} ${unselectedHover}`}`}>
                        {nameOf(w, 'Weapon')} ({weaponDice(w)})
                      </button>
                    ))}
                  </div>
                </div>

                <div className="mb-6">
                  <label className={sectionLabelClass}>Extra Damage</label>
                  <div className="flex flex-wrap gap-2">
                    {settings.extras.map(e => {
                      const p = PALETTE[e.color] || PALETTE.green;
                      const on = !!activeExtras[e.id];
                      return (
                        <button key={e.id} onClick={() => toggleExtra(e.id)}
                          className={`px-3 py-2 rounded ${on ? `${darkMode ? p.dark : p.light} text-white` : unselectedBtnClass}`}>
                          {nameOf(e, 'Extra Damage')} ({diceStr(e)}{e.frequency === 'hit' ? '/hit' : ''})
                        </button>
                      );
                    })}
                    <button onClick={() => setPoisonOn(!poisonOn)}
                      className={`px-3 py-2 rounded ${poisonOn ? poisonSelectedClass : unselectedBtnClass}`}>
                      Poison ({diceStr(selectedPoison)})
                    </button>
                  </div>

                  {poisonOn && (
                    <div className={`mt-3 p-3 rounded flex flex-wrap items-center gap-3 ${darkMode ? 'bg-gray-800' : 'bg-slate-200'}`}>
                      <span className="text-sm font-medium">Poison:</span>
                      <select value={selectedPoison.id} onChange={(e) => setSelectedPoisonId(e.target.value)} className={inputClass}>
                        {settings.poisons.map(p => (
                          <option key={p.id} value={p.id}>{nameOf(p, 'Unnamed Poison')} ({diceStr(p)}, DC {p.dc})</option>
                        ))}
                      </select>
                      <span className="text-sm font-medium">Save:</span>
                      <div className="flex gap-2">
                        <button onClick={() => setPoisonSave('fail')}
                          className={`px-3 py-1 rounded ${poisonSave === 'fail' ? poisonSelectedClass : unselectedBtnClass}`}>
                          Failed
                        </button>
                        <button onClick={() => setPoisonSave('save')}
                          className={`px-3 py-1 rounded ${poisonSave === 'save' ? selectedNeutralClass : unselectedBtnClass}`}>
                          Succeeded
                        </button>
                      </div>
                      <span className={`text-xs ${subtleText}`}>{poisonNote}</span>
                    </div>
                  )}
                </div>

                <div className="mb-6">
                  {hitsHeader}
                  <div className="space-y-4">
                    {weapons.length > 1 && (
                      <div>
                        <label className={subLabelClass}>Mix In Another Weapon</label>
                        <div className="flex flex-wrap gap-2">
                          <button onClick={() => selectMix('none')}
                            className={`px-3 py-1 rounded text-sm ${!mix ? noneSelectedClass : `${unselectedBtnClass} ${unselectedHover}`}`}>
                            None
                          </button>
                          {weapons.filter(w => w.id !== main.id).map(w => (
                            <button key={w.id} onClick={() => selectMix(w.id)}
                              className={`px-3 py-1 rounded text-sm ${mix && mix.id === w.id ? selectedNeutralClass : `${unselectedBtnClass} ${unselectedHover}`}`}>
                              {nameOf(w, 'Weapon')} ({weaponDice(w)})
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {mix && (
                      <div className="grid grid-cols-2 gap-4 max-w-xl">
                        <div>
                          <label className={subLabelClass}>{nameOf(mix, 'Weapon')} Hits (Total)</label>
                          <div className="flex gap-2">
                            {Array.from({ length: A + 1 }, (_, n) => (
                              <button key={n} onClick={() => { setMixTotal(n); setMixCrits(Math.min(mCrits, n)); }}
                                className={`px-3 py-1 rounded ${mTotal === n ? selectedHitClass : unselectedBtnClass}`}>
                                {n}
                              </button>
                            ))}
                          </div>
                        </div>
                        <div>
                          <label className={subLabelClass}>{nameOf(mix, 'Weapon')} Crits (of those hits)</label>
                          <div className="flex gap-2">
                            {Array.from({ length: mTotal + 1 }, (_, n) => (
                              <button key={n} onClick={() => setMixCrits(n)}
                                className={`px-3 py-1 rounded ${mCrits === n ? selectedCritClass : unselectedBtnClass}`}>
                                {n}
                              </button>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}

                    {bonusOptions.length > 0 && (
                      <div>
                        <label className={subLabelClass}>Bonus Action Attack</label>
                        <div className="flex flex-wrap items-center gap-2">
                          {bonusOptions.length > 1 ? (
                            <select value={bonusWeapon.id} onChange={(e) => setBonusId(e.target.value)} className={inputClass}>
                              {bonusOptions.map(w => <option key={w.id} value={w.id}>{nameOf(w, 'Weapon')} ({weaponDice(w)})</option>)}
                            </select>
                          ) : (
                            <span className={`text-sm mr-1 ${subtleText}`}>{nameOf(bonusWeapon, 'Weapon')} ({weaponDice(bonusWeapon)})</span>
                          )}
                          <button onClick={() => setBonusResult('none')}
                            className={`px-3 py-1 rounded ${bResult === 'none' ? noneSelectedClass : unselectedBtnClass}`}>
                            None
                          </button>
                          <button onClick={() => setBonusResult('hit')}
                            className={`px-3 py-1 rounded ${bResult === 'hit' ? selectedHitClass : unselectedBtnClass}`}>
                            Hit
                          </button>
                          <button onClick={() => setBonusResult('crit')}
                            className={`px-3 py-1 rounded ${bResult === 'crit' ? selectedCritClass : unselectedBtnClass}`}>
                            Crit
                          </button>
                        </div>
                      </div>
                    )}

                    <div>
                      {(mix || bonusOptions.length > 0) && (
                        <label className={subLabelClass}>{nameOf(main, 'Weapon')} (Hits / Crits)</label>
                      )}
                      {renderHitGroups(mainStart, mainMax, rollDamage, `Roll (No ${nameOf(main, 'Weapon')} Hits)`)}
                    </div>
                  </div>
                </div>

                {displayAttacks && (
                  <div className={cardClass}>
                    <h2 className="text-lg font-semibold mb-2">Results</h2>

                    <div className={`mb-3 p-2 rounded text-sm ${darkMode ? 'bg-gray-700' : 'bg-slate-300'}`}>
                      {getRerollMessage()}
                      {isSelectMode && (
                        <button onClick={handleSkipReroll} className={`ml-2 ${smallBtnClass}`}>
                          Skip Reroll
                        </button>
                      )}
                    </div>

                    <div className="mb-4">
                      {displayAttacks.map((attack, attackIdx) => {
                        const globalStartIndex = displayAttacks.slice(0, attackIdx).reduce((sum, a) => sum + a.dice.length, 0);
                        return (
                          <AttackRow
                            key={attackIdx}
                            attack={attack}
                            rerolledIndex={results?.rerolledIndex ?? -1}
                            originalValue={results?.originalValue ?? 0}
                            globalStartIndex={globalStartIndex}
                            darkMode={darkMode}
                            selectMode={isSelectMode}
                            onSelectDie={handleManualReroll}
                            showStats={isSelectMode}
                          />
                        );
                      })}
                    </div>
                    <div className={`text-right border-t-2 pt-3 ${rowBorder}`}>
                      <div className={`text-3xl font-bold ${totalTextClass}`}>
                        {pendingReroll?.total ?? results?.total} Total Damage
                      </div>
                    </div>
                    <div className={`mt-2 flex flex-wrap gap-x-3 gap-y-1 text-xs ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>
                      <span><span className={weaponTextClass}>■</span> Weapon</span>
                      {legendExtras.map(d => (
                        <span key={d.group}><span className={dieTextColor(d, darkMode)}>■</span> {d.group}</span>
                      ))}
                      {hasPoisonDice && <span><span className={poisonTextClass}>■</span> Poison</span>}
                      <span><span className="text-amber-400">■</span> Rerolled</span>
                    </div>
                  </div>
                )}

                {rollLog.length > 0 && (
                  <div className={`mt-4 ${cardClass}`}>
                    <div className="flex justify-between items-center mb-2">
                      <h2 className="text-lg font-semibold">Roll Log</h2>
                      <button onClick={() => setRollLog([])} className={smallBtnClass}>
                        Clear
                      </button>
                    </div>
                    <div className="space-y-2">
                      {rollLog.map((entry, idx) => (
                        <div key={entry.id} className={`flex flex-wrap items-center gap-2 text-sm p-2 rounded ${idx === 0 ? (darkMode ? 'bg-gray-700' : 'bg-slate-300') : ''}`}>
                          <span className={darkMode ? 'text-gray-400' : 'text-gray-500'}>{entry.timestamp}</span>
                          <span className={`font-bold ${totalTextClass}`}>{entry.total} Total</span>
                          {orderTypes(Object.keys(entry.breakdown)).filter(t => entry.breakdown[t] !== 0).map(t => (
                            <React.Fragment key={t}>
                              <span className={darkMode ? 'text-gray-500' : 'text-gray-400'}>|</span>
                              <span className={typeTextColor(t, darkMode)}>
                                {entry.breakdown[t]} {capitalize(t)}{t === 'poison' && entry.poisonHalved ? ' (Saved, ½)' : ''}
                              </span>
                            </React.Fragment>
                          ))}
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </>
            )}

            {view === 'settings' && (
              <div className="space-y-4">
                <div className={cardClass}>
                  <h3 className="text-lg font-semibold mb-2">Attacks &amp; Piercer</h3>
                  <div className="flex flex-wrap gap-6">
                    {field('Attacks per Attack Action', renderNumberInput(settings.attacksPerAction, v => updateSetting('attacksPerAction', v), { min: 1, max: 4 }))}
                    {field('Auto-Reroll Threshold (%)', renderNumberInput(settings.rerollThreshold, v => updateSetting('rerollThreshold', v), { min: 0, max: 100 }))}
                  </div>
                  <p className={`text-xs mt-2 ${subtleText}`}>
                    Piercer auto-rerolls when the best die's chance to improve is above the threshold; otherwise you choose. Set it to 100 to always choose manually.
                  </p>
                </div>

                <div className={cardClass}>
                  <h3 className="text-lg font-semibold mb-1">Weapons</h3>
                  <p className={`text-xs mb-1 ${subtleText}`}>
                    Check "Can attack as a bonus action" for weapons that grant an extra attack (like a Scimitar of Speed). As your main weapon, it adds one attack to its grid; otherwise it appears as a Bonus Action option. Piercer only affects piercing damage.
                  </p>
                  {weapons.map(w => (
                    <div key={w.id} className={`py-3 space-y-2 border-b last:border-b-0 ${rowBorder}`}>
                      <div className="flex flex-wrap items-end gap-3">
                        {field('Name', renderTextInput(w.name, v => updateItem('weapons', w.id, 'name', v)))}
                        {field('Dice', renderNumberInput(w.count, v => updateItem('weapons', w.id, 'count', v), { min: 1, width: 'w-16' }))}
                        {field('Die', renderDieSelect(w.die, v => updateItem('weapons', w.id, 'die', v)))}
                        {field('Modifier', renderNumberInput(w.mod, v => updateItem('weapons', w.id, 'mod', v), { width: 'w-16' }))}
                        {field('Damage Type', renderTypeSelect(w.type, v => updateItem('weapons', w.id, 'type', v), false))}
                      </div>
                      <div className="flex flex-wrap items-center gap-4">
                        {renderCheckbox(!!w.bonusAction, v => updateItem('weapons', w.id, 'bonusAction', v), 'Can attack as a bonus action')}
                        <span className={`font-bold ${weaponTextClass}`}>{weaponDice(w)}</span>
                        <button
                          onClick={() => removeItem('weapons', w.id, 1)}
                          disabled={weapons.length <= 1}
                          className={`ml-auto ${smallBtnClass} ${weapons.length <= 1 ? 'opacity-40 cursor-not-allowed' : ''}`}
                        >
                          Remove
                        </button>
                      </div>
                    </div>
                  ))}
                  <button
                    onClick={() => addItem('weapons', { id: makeId('weapon'), name: 'New Weapon', ...WEAPON_DEFAULTS, die: 6 })}
                    className={`mt-3 px-3 py-1 rounded text-sm ${unselectedBtnClass} ${unselectedHover}`}
                  >
                    + Add Weapon
                  </button>
                </div>

                <div className={cardClass}>
                  <h3 className="text-lg font-semibold mb-1">Extra Damage</h3>
                  <p className={`text-xs mb-1 ${subtleText}`}>
                    Once-per-turn damage goes on the first hit (a crit if one lands); every-hit damage is added to each hit. "Same as weapon" uses the damage type of the attack it's added to.
                  </p>
                  {settings.extras.map(e => {
                    const p = PALETTE[e.color] || PALETTE.green;
                    return (
                      <div key={e.id} className={`py-3 space-y-2 border-b last:border-b-0 ${rowBorder}`}>
                        <div className="flex flex-wrap items-end gap-3">
                          {field('Name', renderTextInput(e.name, v => updateItem('extras', e.id, 'name', v)))}
                          {field('Dice', renderNumberInput(e.count, v => updateItem('extras', e.id, 'count', v), { min: 0, width: 'w-16' }))}
                          {field('Die', renderDieSelect(e.die, v => updateItem('extras', e.id, 'die', v)))}
                          {field('Damage Type', renderTypeSelect(e.type, v => updateItem('extras', e.id, 'type', v), true))}
                          {field('Applies', (
                            <select value={e.frequency} onChange={(ev) => updateItem('extras', e.id, 'frequency', ev.target.value)} className={`${inputClass} w-36`}>
                              <option value="once">Once per turn</option>
                              <option value="hit">Every hit</option>
                            </select>
                          ))}
                        </div>
                        <div className="flex flex-wrap items-center gap-4">
                          {renderCheckbox(!!e.crit, v => updateItem('extras', e.id, 'crit', v), 'Doubles on a crit')}
                          {renderSwatches(e.color, v => updateItem('extras', e.id, 'color', v))}
                          <span className={`font-bold ${darkMode ? p.textDark : p.textLight}`}>
                            {diceStr(e)}{e.frequency === 'hit' ? ' per hit' : ''}
                          </span>
                          <button onClick={() => removeItem('extras', e.id, 0)} className={`ml-auto ${smallBtnClass}`}>
                            Remove
                          </button>
                        </div>
                      </div>
                    );
                  })}
                  <button
                    onClick={() => addItem('extras', { id: makeId('extra'), name: 'New Damage', ...EXTRA_DEFAULTS, color: 'teal' })}
                    className={`mt-3 px-3 py-1 rounded text-sm ${unselectedBtnClass} ${unselectedHover}`}
                  >
                    + Add Extra Damage
                  </button>
                </div>

                <div className={cardClass}>
                  <h3 className="text-lg font-semibold mb-1">Poisons</h3>
                  <p className={`text-xs mb-1 ${subtleText}`}>Poison damage isn't doubled on a crit and isn't eligible for Piercer.</p>
                  {settings.poisons.map(p => (
                    <div key={p.id} className={`flex flex-wrap items-end gap-3 py-3 border-b last:border-b-0 ${rowBorder}`}>
                      {field('Name', renderTextInput(p.name, v => updateItem('poisons', p.id, 'name', v)))}
                      {field('Dice', renderNumberInput(p.count, v => updateItem('poisons', p.id, 'count', v), { min: 0, width: 'w-16' }))}
                      {field('Die', renderDieSelect(p.die, v => updateItem('poisons', p.id, 'die', v)))}
                      {field('Save DC', renderNumberInput(p.dc, v => updateItem('poisons', p.id, 'dc', v), { min: 1, width: 'w-16' }))}
                      {field('On Successful Save', (
                        <select value={p.onSave} onChange={(e) => updateItem('poisons', p.id, 'onSave', e.target.value)} className={`${inputClass} w-36`}>
                          <option value="none">No damage</option>
                          <option value="half">Half damage</option>
                        </select>
                      ))}
                      <span className={`pb-1 font-bold ${poisonTextClass}`}>{diceStr(p)}</span>
                      <button
                        onClick={() => removeItem('poisons', p.id, 1)}
                        disabled={settings.poisons.length <= 1}
                        className={`mb-1 ml-auto ${smallBtnClass} ${settings.poisons.length <= 1 ? 'opacity-40 cursor-not-allowed' : ''}`}
                      >
                        Remove
                      </button>
                    </div>
                  ))}
                  <button
                    onClick={() => addItem('poisons', { id: makeId('poison'), name: 'New Poison', ...POISON_DEFAULTS })}
                    className={`mt-3 px-3 py-1 rounded text-sm text-white ${darkMode ? 'bg-rose-700 hover:bg-rose-600' : 'bg-pink-500 hover:bg-pink-600'}`}
                  >
                    + Add Poison
                  </button>
                </div>

                <div className="flex flex-wrap items-center justify-between gap-2">
                  <span className={`text-xs ${subtleText}`}>{saveMessage}</span>
                  {confirmReset ? (
                    <div className="flex gap-2">
                      <button onClick={resetSettings}
                        className={`px-3 py-1 rounded text-sm text-white ${darkMode ? 'bg-red-800 hover:bg-red-700' : 'bg-red-600 hover:bg-red-700'}`}>
                        Confirm Reset
                      </button>
                      <button onClick={() => setConfirmReset(false)} className={`px-3 py-1 rounded text-sm ${unselectedBtnClass}`}>
                        Cancel
                      </button>
                    </div>
                  ) : (
                    <button onClick={() => setConfirmReset(true)} className={`px-3 py-1 rounded text-sm ${unselectedBtnClass} ${unselectedHover}`}>
                      Reset to Defaults
                    </button>
                  )}
                </div>
              </div>
            )}

            <footer className={`mt-10 pt-4 border-t flex justify-center gap-2 ${rowBorder}`}>
              <button onClick={() => setShowAbout(true)} className={`px-3 py-1 rounded text-xs ${unselectedBtnClass} ${unselectedHover}`}>
                About
              </button>
            </footer>
          </div>

          {showAbout && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60" onClick={() => setShowAbout(false)}>
              <div
                role="dialog"
                aria-modal="true"
                aria-labelledby="about-title"
                onClick={(e) => e.stopPropagation()}
                className={`w-full max-w-lg max-h-[85vh] overflow-y-auto rounded-lg border-2 p-5 ${darkMode ? 'bg-gray-800 border-gray-600 text-gray-100' : 'bg-white border-slate-300 text-gray-900'}`}
              >
                <div className="flex justify-between items-start mb-3">
                  <h2 id="about-title" className="text-xl font-bold">About</h2>
                  <button onClick={() => setShowAbout(false)} aria-label="Close" className={`px-2 py-1 rounded text-sm ${unselectedBtnClass}`}>✕</button>
                </div>
                <div className="space-y-3 text-sm">
                  <p>
                    The 5e Piercer Feat Dice Roller rolls a full turn of weapon damage, including extra damage like Sneak Attack and poison, and applies the Piercer feat's reroll for you.
                  </p>
                  <h3 className="font-semibold text-base">How it works</h3>
                  <ul className="list-disc pl-5 space-y-1">
                    <li>Pick your main weapon and toggle any extra damage for the turn, then tap the button that matches how many attacks hit and how many were crits.</li>
                    <li>If a turn uses more than one weapon, mix in a second weapon or add a bonus action attack before rolling.</li>
                    <li>Once-per-turn extra damage goes on a crit when one lands, so its dice are doubled too. Every-hit damage is added to each hit.</li>
                    <li>Critical hits double the damage dice, and piercing crits add Piercer's extra die.</li>
                    <li>Piercer rerolls one piercing damage die per turn. When a reroll is likely to help, the die with the highest expected gain is rerolled automatically; otherwise you pick a die (its odds are shown) or skip. The new roll always stands.</li>
                    <li>Add your own weapons, extra damage, and poisons in the Settings tab. Settings are saved in this browser only.</li>
                  </ul>
                  <h3 className="font-semibold text-base">License</h3>
                  <p>
                    Copyright © {APP_INFO.year} {APP_INFO.author}. Released under the BSD 3-Clause License.{' '}
                    {APP_INFO.repoUrl ? (
                      <>See the full license in the <a href={APP_INFO.repoUrl} target="_blank" rel="noopener noreferrer" className="underline">GitHub repository</a>.</>
                    ) : 'See the full license in the project repository.'}
                  </p>
                  <h3 className="font-semibold text-base">Credits</h3>
                  <p>Built with the help of Claude, an AI model made by Anthropic.</p>
                  <p className={`text-xs ${subtleText}`}>
                    Unofficial fan tool. Not affiliated with or endorsed by Wizards of the Coast.
                  </p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PiercerDiceRoller />);
  </script>
</body>
</html>
