<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5e Piercer Feat Dice Roller</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>" />

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 + ReactDOM -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Babel compiles the JSX below in the browser -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <noscript>This app requires JavaScript to run.</noscript>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // ---------- App info (shown in the About panel) ----------
    const APP_INFO = {
      author: 'Hunter Hearl',
      year: 2026,
      repoUrl: 'https://github.com/MacSax7/piercer-dice-roller', // e.g. 'https://github.com/yourname/piercer-roller' (adds a link in About)
    };

    // ---------- Theme colors for the Hits / Crits buttons ----------
    // Swap the color name for any Tailwind color (red, rose, orange, amber, emerald,
    // teal, sky, blue, indigo, violet, slate...) and adjust the shade number:
    // lower numbers are lighter and brighter, higher numbers are deeper and calmer.
    // "light" is used in light mode, "dark" in dark mode. Hover is usually one step away.
    const THEME = {
      hit: {
        light: 'bg-red-500', lightHover: 'hover:bg-red-600',
        dark: 'bg-red-900', darkHover: 'hover:bg-red-800',
      },
      crit: {
        light: 'bg-blue-500', lightHover: 'hover:bg-blue-600',
        dark: 'bg-blue-900', darkHover: 'hover:bg-blue-800',
      },
    };

    // ---------- Storage (Claude artifact storage if present, otherwise browser localStorage) ----------
    const STORAGE_KEY = 'piercer-settings';

    const settingsStore = {
      available() {
        if (window.storage) return true;
        try {
          const k = '__piercer_test__';
          window.localStorage.setItem(k, k);
          window.localStorage.removeItem(k);
          return true;
        } catch (err) {
          return false;
        }
      },
      async get() {
        if (window.storage) {
          const result = await window.storage.get(STORAGE_KEY, false);
          return result ? result.value : null;
        }
        return window.localStorage.getItem(STORAGE_KEY);
      },
      async set(value) {
        if (window.storage) {
          const result = await window.storage.set(STORAGE_KEY, value, false);
          return !!result;
        }
        window.localStorage.setItem(STORAGE_KEY, value);
        return true;
      },
    };

    const STORAGE_AVAILABLE = settingsStore.available();

    // ---------- Helpers ----------
    const rollDie = (sides) => Math.floor(Math.random() * sides) + 1;

    const toInt = (v, fallback = 0) => {
      const n = parseInt(v, 10);
      return isNaN(n) ? fallback : n;
    };

    const formatMod = (mod) => {
      const m = toInt(mod, 0);
      if (m === 0) return '';
      return m > 0 ? `+${m}` : `${m}`;
    };

    const weaponDice = (wp) => `1d${toInt(wp.die, 8)}${formatMod(wp.mod)}`;
    const diceStr = (cfg) => `${Math.max(0, toInt(cfg.count, 0))}d${toInt(cfg.die, 6)}`;

    const DIE_OPTIONS = [4, 6, 8, 10, 12];

    const DEFAULT_SETTINGS = {
      attacksPerAction: 2,
      rerollThreshold: 50,
      weapons: {
        rapier: { name: 'Rapier', die: 8, mod: 9 },
        dagger: { name: 'Dagger', die: 4, mod: 8 },
        lightXbow: { name: 'Light Crossbow', die: 8, mod: 6 },
        handXbow: { name: 'Hand Crossbow', die: 6, mod: 6 },
      },
      extras: {
        sneak: { count: 2, die: 6 },
        swarm: { count: 1, die: 6 },
        favored: { count: 1, die: 6 },
      },
      poisons: [
        { id: 'poisoner', name: 'Poisoner Feat', count: 2, die: 8, dc: 14, onSave: 'none' },
      ],
    };

    const EXTRA_META = {
      sneak: { name: 'Sneak Attack', single: 'Sneak', short: 'Sneak', type: 'sneak' },
      swarm: { name: 'Swarm', single: 'Swarm', short: 'Swarm', type: 'swarm' },
      favored: { name: 'Favored Foe', single: 'Favored Foe', short: 'Favored', type: 'favored' },
    };
    const POISON_META = { single: 'Poison', short: 'Poison', type: 'poison' };

    const mergeSettings = (saved) => {
      if (!saved || typeof saved !== 'object') return DEFAULT_SETTINGS;
      const mergeGroup = (group) => Object.fromEntries(
        Object.keys(DEFAULT_SETTINGS[group]).map(k => [k, { ...DEFAULT_SETTINGS[group][k], ...(saved[group]?.[k] || {}) }])
      );
      return {
        ...DEFAULT_SETTINGS,
        ...saved,
        weapons: mergeGroup('weapons'),
        extras: mergeGroup('extras'),
        poisons: Array.isArray(saved.poisons) && saved.poisons.length > 0 ? saved.poisons : DEFAULT_SETTINGS.poisons,
      };
    };

    // Damage math helpers (single source of truth for all totals)
    const sumDice = (dice) => dice.reduce((s, d) => s + d.value, 0);
    const poisonRaw = (attack) => sumDice(attack.dice.filter(d => d.type === 'poison'));
    const poisonDamage = (attack) => attack.poisonHalved ? Math.floor(poisonRaw(attack) / 2) : poisonRaw(attack);
    const piercingDamage = (attack) => sumDice(attack.dice.filter(d => d.type !== 'poison')) + attack.modifier;
    const attackTotal = (attack) => piercingDamage(attack) + poisonDamage(attack);
    const totalOf = (attacks) => attacks.reduce((s, a) => s + attackTotal(a), 0);

    const calcExpectedImprovement = (value, sides) => (sides + 1) / 2 - value;
    const calcImprovementProbability = (value, sides) => Math.max(0, (sides - value) / sides * 100);

    // ---------- Components ----------
    const DieResult = ({ die, isRerolled, originalValue, darkMode, selectable, onSelect, showStats }) => {
      const bgColor = isRerolled
        ? (darkMode ? 'bg-amber-900 border-amber-600' : 'bg-amber-200 border-amber-400')
        : (darkMode ? 'bg-gray-700 border-gray-500' : 'bg-white border-slate-300');

      const getTextColor = () => {
        switch (die.type) {
          case 'sneak':
          case 'swarm':
            return darkMode ? 'text-green-400' : 'text-green-600';
          case 'favored':
            return darkMode ? 'text-purple-400' : 'text-purple-600';
          case 'poison':
            return darkMode ? 'text-rose-400' : 'text-pink-600';
          default:
            return darkMode ? 'text-blue-400' : 'text-blue-600';
        }
      };

      const improvementProb = calcImprovementProbability(die.value, die.sides);
      const getProbColor = () => {
        if (improvementProb <= 10) return darkMode ? 'text-red-400' : 'text-red-600';
        if (improvementProb <= 50) return darkMode ? 'text-yellow-400' : 'text-yellow-600';
        return darkMode ? 'text-green-400' : 'text-green-600';
      };

      return (
        <div
          className={`inline-flex flex-col items-center p-2 rounded border-2 ${bgColor} ${selectable ? 'cursor-pointer hover:border-amber-500 hover:scale-105 transition-transform' : ''}`}
          onClick={selectable ? onSelect : undefined}
        >
          <span className={`text-xs mb-1 ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>{die.label}</span>
          <div className="flex items-center gap-1">
            {isRerolled && (
              <>
                <span className="text-lg text-red-400 line-through">{originalValue}</span>
                <span className={darkMode ? 'text-gray-500' : 'text-gray-400'}>→</span>
              </>
            )}
            <span className={`text-xl font-bold ${getTextColor()}`}>{die.value}</span>
          </div>
          <span className={`text-xs ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>d{die.sides}</span>
          {!die.piercing && <span className={`text-xs ${getTextColor()}`}>(non-piercing)</span>}
          {showStats && die.piercing && (
            <div className={`text-xs mt-1 ${getProbColor()}`}>{improvementProb.toFixed(0)}% to improve</div>
          )}
        </div>
      );
    };

    const AttackRow = ({ attack, rerolledIndex, originalValue, globalStartIndex, darkMode, selectMode, onSelectDie, showStats }) => {
      const subtotal = attackTotal(attack);
      const mod = attack.modifier;

      return (
        <div className={`flex flex-wrap items-center gap-1 py-2 border-b last:border-b-0 ${darkMode ? 'border-gray-600' : 'border-slate-300'}`}>
          <div className={`w-full text-sm font-medium mb-1 ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>{attack.label}</div>
          <div className="flex flex-wrap items-center gap-1 flex-1">
            {attack.dice.map((die, idx) => {
              const globalIdx = globalStartIndex + idx;
              return (
                <DieResult
                  key={idx}
                  die={die}
                  isRerolled={globalIdx === rerolledIndex}
                  originalValue={originalValue}
                  darkMode={darkMode}
                  selectable={selectMode && die.piercing}
                  onSelect={() => onSelectDie(globalIdx)}
                  showStats={showStats && die.piercing}
                />
              );
            })}
            {mod !== 0 && (
              <div className={`inline-flex items-center px-2 py-1 font-medium ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>
                {mod > 0 ? `+${mod}` : `−${Math.abs(mod)}`}
              </div>
            )}
            {attack.poisonHalved && (
              <div className={`inline-flex items-center px-2 py-1 text-xs font-medium ${darkMode ? 'text-rose-400' : 'text-pink-600'}`}>
                Poison saved: {poisonRaw(attack)} → {poisonDamage(attack)} (½)
              </div>
            )}
          </div>
          <div className={`text-lg font-bold ml-auto pl-4 ${darkMode ? 'text-gray-200' : 'text-gray-700'}`}>
            = {subtotal}
          </div>
        </div>
      );
    };

    function PiercerDiceRoller() {
      const [view, setView] = useState('roller');
      const [showAbout, setShowAbout] = useState(false);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [settingsLoaded, setSettingsLoaded] = useState(false);
      const [saveStatus, setSaveStatus] = useState('idle');
      const [confirmReset, setConfirmReset] = useState(false);
      const skipFirstSave = useRef(true);

      const [weapon, setWeapon] = useState('rapier');
      const [extras, setExtras] = useState({ sneak: false, swarm: false, favored: false, poison: false });
      const [selectedPoisonId, setSelectedPoisonId] = useState(DEFAULT_SETTINGS.poisons[0].id);
      const [poisonSave, setPoisonSave] = useState('fail');
      const [results, setResults] = useState(null);
      const [pendingReroll, setPendingReroll] = useState(null);
      const [daggerTotal, setDaggerTotal] = useState(0);
      const [daggerCrits, setDaggerCrits] = useState(0);
      const [bonusRapier, setBonusRapier] = useState('none');
      const [rollLog, setRollLog] = useState([]);
      const [darkMode, setDarkMode] = useState(() => window.matchMedia('(prefers-color-scheme: dark)').matches);

      useEffect(() => {
        const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        const handleChange = (e) => setDarkMode(e.matches);
        mediaQuery.addEventListener('change', handleChange);
        return () => mediaQuery.removeEventListener('change', handleChange);
      }, []);

      // Match the page background and native controls to the current theme
      useEffect(() => {
        document.body.style.backgroundColor = darkMode ? '#111827' : '#f1f5f9';
        document.documentElement.style.colorScheme = darkMode ? 'dark' : 'light';
      }, [darkMode]);

      // Close the About panel with the Escape key
      useEffect(() => {
        if (!showAbout) return;
        const onKey = (e) => { if (e.key === 'Escape') setShowAbout(false); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [showAbout]);

      // Load saved settings once
      useEffect(() => {
        const load = async () => {
          try {
            const raw = await settingsStore.get();
            if (raw) setSettings(mergeSettings(JSON.parse(raw)));
          } catch (err) {
            // No saved settings yet; defaults are used
          } finally {
            setSettingsLoaded(true);
          }
        };
        load();
      }, []);

      // Auto-save settings (debounced) after they've loaded
      useEffect(() => {
        if (!settingsLoaded || !STORAGE_AVAILABLE) return;
        if (skipFirstSave.current) {
          skipFirstSave.current = false;
          return;
        }
        setSaveStatus('saving');
        const t = setTimeout(async () => {
          try {
            const ok = await settingsStore.set(JSON.stringify(settings));
            setSaveStatus(ok ? 'saved' : 'error');
          } catch (err) {
            setSaveStatus('error');
          }
        }, 600);
        return () => clearTimeout(t);
      }, [settings, settingsLoaded]);

      // ---------- Derived values from settings ----------
      const W = settings.weapons;
      const A = Math.min(4, Math.max(1, toInt(settings.attacksPerAction, 2)));
      const threshold = Math.min(100, Math.max(0, toInt(settings.rerollThreshold, 50)));
      const selectedPoison = settings.poisons.find(p => p.id === selectedPoisonId) || settings.poisons[0];
      const isCrossbow = weapon === 'lightXbow' || weapon === 'handXbow';
      const dTotal = Math.min(daggerTotal, A);
      const dCrits = Math.min(daggerCrits, dTotal);

      const loadouts = {
        rapier: { label: `Rapier (${weaponDice(W.rapier)})` },
        daggerRapier: { label: `Dagger (${weaponDice(W.dagger)}) + Rapier (${weaponDice(W.rapier)})` },
        lightXbow: { label: `Light Crossbow (${weaponDice(W.lightXbow)})` },
        handXbow: { label: `Hand Crossbow (${weaponDice(W.handXbow)})` },
      };

      // ---------- Settings updaters ----------
      const updateSetting = (field, value) => setSettings(s => ({ ...s, [field]: value }));
      const updateWeapon = (key, field, value) => setSettings(s => ({ ...s, weapons: { ...s.weapons, [key]: { ...s.weapons[key], [field]: value } } }));
      const updateExtra = (key, field, value) => setSettings(s => ({ ...s, extras: { ...s.extras, [key]: { ...s.extras[key], [field]: value } } }));
      const updatePoison = (id, field, value) => setSettings(s => ({ ...s, poisons: s.poisons.map(p => p.id === id ? { ...p, [field]: value } : p) }));
      const addPoison = () => setSettings(s => ({
        ...s,
        poisons: [...s.poisons, { id: `poison-${Date.now()}`, name: 'New Poison', count: 1, die: 6, dc: 10, onSave: 'half' }],
      }));
      const removePoison = (id) => setSettings(s => (s.poisons.length <= 1 ? s : { ...s, poisons: s.poisons.filter(p => p.id !== id) }));
      const resetSettings = () => {
        setSettings(DEFAULT_SETTINGS);
        setSelectedPoisonId(DEFAULT_SETTINGS.poisons[0].id);
        setConfirmReset(false);
      };

      // ---------- Rolling logic ----------
      const formatHitLabel = (hits, crits) => {
        const total = hits + crits;
        const hitWord = total === 1 ? 'Hit' : 'Hits';
        if (crits === 0) return `${total} ${hitWord}`;
        const critWord = crits === 1 ? 'Crit' : 'Crits';
        return `${total} ${hitWord} w/ ${crits} ${critWord}`;
      };

      const toggleExtra = (key) => setExtras(prev => ({ ...prev, [key]: !prev[key] }));

      const addToLog = (attacks) => {
        const piercing = attacks.reduce((s, a) => s + piercingDamage(a), 0);
        const poison = attacks.reduce((s, a) => s + poisonDamage(a), 0);
        const logEntry = {
          id: Date.now(),
          total: piercing + poison,
          piercing,
          poison,
          poisonHalved: attacks.some(a => a.poisonHalved),
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        };
        setRollLog(prev => [logEntry, ...prev].slice(0, 10));
      };

      const findOptimalReroll = (allDice) => {
        const piercingDice = allDice.map((d, idx) => ({ ...d, idx })).filter(d => d.piercing);
        if (piercingDice.length === 0) return { index: -1, reason: 'no-piercing', bestProb: 0 };

        let bestIdx = -1;
        let bestImprovement = -Infinity;
        let bestProb = 0;

        piercingDice.forEach(d => {
          const improvement = calcExpectedImprovement(d.value, d.sides);
          if (improvement > bestImprovement) {
            bestImprovement = improvement;
            bestIdx = d.idx;
            bestProb = calcImprovementProbability(d.value, d.sides);
          }
        });

        if (bestImprovement <= 0) return { index: -1, reason: 'no-benefit', bestProb };
        return { index: bestIdx, reason: 'optimal', improvement: bestImprovement, bestProb };
      };

      const makeWeaponAttack = (num, wp, isCrit, suffix = '') => {
        const die = toInt(wp.die, 8);
        const dice = [{ label: wp.name, sides: die, value: rollDie(die), piercing: true, type: 'weapon' }];
        if (isCrit) {
          dice.push({ label: `${wp.name} Crit`, sides: die, value: rollDie(die), piercing: true, type: 'weapon' });
          dice.push({ label: 'Piercer Bonus', sides: die, value: rollDie(die), piercing: true, type: 'weapon' });
        }
        return {
          label: `Attack ${num} (${wp.name}${isCrit ? ' Crit' : ''}${suffix})`,
          dice,
          modifier: toInt(wp.mod, 0),
        };
      };

      const pushDiceSet = (attack, meta, cfg, isCrit, piercing) => {
        const count = Math.max(0, toInt(cfg.count, 0));
        const die = toInt(cfg.die, 6);
        for (let i = 0; i < count; i++) {
          attack.dice.push({ label: count === 1 ? meta.single : `${meta.short} ${i + 1}`, sides: die, value: rollDie(die), piercing, type: meta.type });
        }
        if (isCrit) {
          for (let i = 0; i < count; i++) {
            attack.dice.push({ label: count === 1 ? `${meta.short} Crit` : `${meta.short} Crit ${i + 1}`, sides: die, value: rollDie(die), piercing, type: meta.type });
          }
        }
      };

      const addExtraDamage = (attack, isCrit) => {
        ['sneak', 'swarm', 'favored'].forEach(key => {
          if (extras[key]) pushDiceSet(attack, EXTRA_META[key], settings.extras[key], isCrit, true);
        });
        if (extras.poison && selectedPoison) {
          const saved = poisonSave === 'save';
          if (!saved || selectedPoison.onSave === 'half') {
            // Poison is a saving-throw effect: never doubled on a crit, never Piercer-eligible
            pushDiceSet(attack, POISON_META, selectedPoison, false, false);
            if (saved) attack.poisonHalved = true;
          }
        }
      };

      const rollDamage = (hits, crits, daggerHits = 0, daggerCritsCount = 0, bonusRapierType = 'none') => {
        // Build the attack order: crits first so extra damage lands on a crit when one exists
        const plan = [];
        const repeat = (n, entry) => { for (let i = 0; i < n; i++) plan.push(entry); };

        if (weapon === 'daggerRapier') {
          repeat(daggerCritsCount, { wp: W.dagger, isCrit: true });
          repeat(crits, { wp: W.rapier, isCrit: true });
          repeat(daggerHits, { wp: W.dagger, isCrit: false });
          repeat(hits, { wp: W.rapier, isCrit: false });
        } else if (isCrossbow) {
          const xb = W[weapon];
          if (bonusRapierType === 'crit') plan.push({ wp: W.rapier, isCrit: true, suffix: ' - Bonus' });
          repeat(crits, { wp: xb, isCrit: true });
          repeat(hits, { wp: xb, isCrit: false });
          if (bonusRapierType === 'hit') plan.push({ wp: W.rapier, isCrit: false, suffix: ' - Bonus' });
        } else {
          repeat(crits, { wp: W.rapier, isCrit: true });
          repeat(hits, { wp: W.rapier, isCrit: false });
        }

        if (plan.length === 0) return;

        const attacks = plan.map((p, i) => {
          const attack = makeWeaponAttack(i + 1, p.wp, p.isCrit, p.suffix);
          if (i === 0) addExtraDamage(attack, p.isCrit);
          return attack;
        });

        const allDice = attacks.flatMap(a => a.dice);
        const optimal = findOptimalReroll(allDice);

        if (optimal.bestProb > threshold && optimal.index >= 0) {
          const originalValue = allDice[optimal.index].value;
          allDice[optimal.index].value = rollDie(allDice[optimal.index].sides);
          setResults({ attacks, rerolledIndex: optimal.index, originalValue, total: totalOf(attacks), rerollReason: 'auto', autoRerolled: true });
          setPendingReroll(null);
          addToLog(attacks);
        } else {
          setPendingReroll({ attacks, total: totalOf(attacks), reason: optimal.reason, bestProb: optimal.bestProb });
          setResults(null);
        }
      };

      const handleManualReroll = (dieIndex) => {
        if (!pendingReroll) return;
        const { attacks } = pendingReroll;
        const allDice = attacks.flatMap(a => a.dice);
        const originalValue = allDice[dieIndex].value;
        allDice[dieIndex].value = rollDie(allDice[dieIndex].sides);

        setResults({ attacks, rerolledIndex: dieIndex, originalValue, total: totalOf(attacks), rerollReason: 'manual', autoRerolled: false });
        setPendingReroll(null);
        addToLog(attacks);
      };

      const handleSkipReroll = () => {
        if (!pendingReroll) return;
        setResults({ attacks: pendingReroll.attacks, rerolledIndex: -1, originalValue: 0, total: pendingReroll.total, rerollReason: 'skipped', autoRerolled: false });
        setPendingReroll(null);
        addToLog(pendingReroll.attacks);
      };

      const getRerollMessage = () => {
        if (pendingReroll) {
          if (pendingReroll.reason === 'no-benefit') {
            return 'Piercer: No reroll is expected to improve damage. Click a die to gamble anyway, or skip:';
          }
          return `Piercer: Best chance to improve is ${pendingReroll.bestProb.toFixed(0)}%. Click a die to reroll, or skip:`;
        }
        if (!results) return '';
        if (results.rerollReason === 'skipped') return 'Piercer: Reroll skipped';
        if (results.rerolledIndex >= 0) {
          const die = results.attacks.flatMap(a => a.dice)[results.rerolledIndex];
          return `Piercer: ${results.autoRerolled ? 'Auto-rerolled' : 'Rerolled'} ${die.label} (${results.originalValue} → ${die.value})`;
        }
        return '';
      };

      // ---------- Shared styling ----------
      const mode = darkMode ? 'dark' : 'light';
      const hoverKey = darkMode ? 'darkHover' : 'lightHover';
      const unselectedBtnClass = darkMode ? 'bg-gray-700 text-gray-100' : 'bg-gray-200 text-gray-900';
      const selectedHitClass = `${THEME.hit[mode]} text-white`;
      const selectedCritClass = `${THEME.crit[mode]} text-white`;
      const selectedNeutralClass = darkMode ? 'bg-indigo-500 text-white' : 'bg-gray-800 text-white';
      const poisonSelectedClass = darkMode ? 'bg-rose-700 text-white' : 'bg-pink-500 text-white';
      const cardClass = `border-2 rounded-lg p-4 ${darkMode ? 'border-gray-600 bg-gray-800' : 'border-slate-300 bg-slate-200'}`;
      const rowBorder = darkMode ? 'border-gray-600' : 'border-slate-300';
      const dividerClass = darkMode ? 'divide-gray-700' : 'divide-slate-300';
      const inputClass = `rounded border px-2 py-1 ${darkMode ? 'bg-gray-700 border-gray-600 text-gray-100' : 'bg-white border-slate-300 text-gray-900'}`;
      const subtleText = darkMode ? 'text-gray-400' : 'text-gray-600';
      const sectionLabelClass = 'block text-lg font-semibold mb-2';
      const subLabelClass = 'block text-sm font-medium mb-2';
      const color = {
        weapon: darkMode ? 'text-blue-400' : 'text-blue-600',
        green: darkMode ? 'text-green-400' : 'text-green-600',
        favored: darkMode ? 'text-purple-400' : 'text-purple-600',
        poison: darkMode ? 'text-rose-400' : 'text-pink-600',
      };

      const hitBtnClass = (crits) => {
        const c = crits > 0 ? THEME.crit : THEME.hit;
        return `${c[mode]} ${c[hoverKey]}`;
      };

      const renderHitGroups = (startTotal, maxTotal, onRoll, zeroLabel = '', compact = false) => {
        const groups = [];
        for (let total = startTotal; total <= maxTotal; total++) {
          const btns = [];
          for (let crits = 0; crits <= total; crits++) {
            const hits = total - crits;
            btns.push(
              <button key={`${hits}-${crits}`}
                onClick={() => onRoll(hits, crits)}
                className={`rounded text-white ${compact ? 'p-2 text-sm' : 'p-3 font-medium'} ${hitBtnClass(crits)}`}>
                {total === 0 ? zeroLabel : formatHitLabel(hits, crits)}
              </button>
            );
            if (total === 0) break;
          }
          groups.push(<div key={total} className="grid grid-cols-2 gap-2 py-4 first:pt-0 last:pb-0">{btns}</div>);
        }
        return <div className={`flex flex-col max-w-xl divide-y ${dividerClass}`}>{groups}</div>;
      };

      const hitsHeader = (
        <label className={sectionLabelClass}>
          Hits / Crits <span className={`ml-1 text-sm font-normal ${subtleText}`}>Click to roll</span>
        </label>
      );

      // Render helpers (plain functions, not components, so inputs keep focus while typing)
      const field = (label, control) => (
        <label className={`flex flex-col gap-1 text-xs ${subtleText}`}>
          {label}
          {control}
        </label>
      );

      const renderDieSelect = (value, onChange) => (
        <select value={value} onChange={(e) => onChange(parseInt(e.target.value, 10))} className={`${inputClass} w-20`}>
          {DIE_OPTIONS.map(d => <option key={d} value={d}>d{d}</option>)}
        </select>
      );

      const renderNumberInput = (value, onChange, opts = {}) => (
        <input
          type="number"
          value={value}
          min={opts.min}
          max={opts.max}
          onChange={(e) => onChange(e.target.value === '' ? '' : parseInt(e.target.value, 10))}
          className={`${inputClass} ${opts.width || 'w-20'}`}
        />
      );

      const saveMessage = !STORAGE_AVAILABLE
        ? "Settings can't be saved in this browser (private browsing may block storage)"
        : !settingsLoaded ? 'Loading saved settings…'
        : saveStatus === 'saving' ? 'Saving…'
        : saveStatus === 'saved' ? '✓ Saved'
        : saveStatus === 'error' ? "Couldn't save; changes will last for this session only"
        : 'Changes save automatically';

      const poisonNote = poisonSave === 'fail'
        ? `Full damage (${diceStr(selectedPoison)})`
        : selectedPoison.onSave === 'half' ? 'Half damage, rounded down' : 'No poison damage on a successful save';

      const displayAttacks = pendingReroll?.attacks || results?.attacks;
      const isSelectMode = !!pendingReroll;

      return (
        <div className={`p-4 w-full min-h-screen ${darkMode ? 'bg-gray-900 text-gray-100' : 'bg-slate-100 text-gray-900'}`}>
          <div className="flex justify-between items-start gap-4 mb-4">
            <div>
              <h1 className="text-2xl font-bold">5e Piercer Feat Dice Roller</h1>
              <p className={`text-sm mt-1 ${subtleText}`}>
                Roll a full turn's damage in one tap, with the Piercer feat's once-per-turn reroll applied to the die most likely to improve.
              </p>
            </div>
            <button
              onClick={() => setDarkMode(!darkMode)}
              className={`shrink-0 px-3 py-1 rounded text-sm ${darkMode ? 'bg-gray-700 hover:bg-gray-600 text-gray-100' : 'bg-gray-200 hover:bg-gray-300 text-gray-900'}`}
            >
              {darkMode ? '☀️ Light' : '🌙 Dark'}
            </button>
          </div>

          <div className="flex gap-2 mb-6">
            {[['roller', '🎲 Roller'], ['settings', '⚙️ Settings']].map(([key, label]) => (
              <button key={key} onClick={() => setView(key)}
                className={`px-4 py-2 rounded font-medium ${view === key ? selectedNeutralClass : `${unselectedBtnClass} ${darkMode ? 'hover:bg-gray-600' : 'hover:bg-gray-300'}`}`}>
                {label}
              </button>
            ))}
          </div>

          {view === 'roller' && (
            <>
              <div className="mb-6">
                <label className={sectionLabelClass}>Weapon</label>
                <div className="flex flex-wrap gap-2">
                  {Object.entries(loadouts).map(([key, l]) => (
                    <button key={key} onClick={() => { setWeapon(key); setBonusRapier('none'); setDaggerTotal(0); setDaggerCrits(0); }}
                      className={`px-4 py-2 rounded ${weapon === key
                        ? selectedNeutralClass
                        : `${unselectedBtnClass} ${darkMode ? 'hover:bg-gray-600' : 'hover:bg-gray-300'}`}`}>
                      {l.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="mb-6">
                <label className={sectionLabelClass}>Extra Damage</label>
                <div className="flex flex-wrap gap-2">
                  <button onClick={() => toggleExtra('sneak')}
                    className={`px-3 py-2 rounded ${extras.sneak ? (darkMode ? 'bg-green-700 text-white' : 'bg-green-500 text-white') : unselectedBtnClass}`}>
                    Sneak Attack ({diceStr(settings.extras.sneak)})
                  </button>
                  <button onClick={() => toggleExtra('swarm')}
                    className={`px-3 py-2 rounded ${extras.swarm ? (darkMode ? 'bg-green-700 text-white' : 'bg-green-500 text-white') : unselectedBtnClass}`}>
                    Swarm ({diceStr(settings.extras.swarm)})
                  </button>
                  <button onClick={() => toggleExtra('favored')}
                    className={`px-3 py-2 rounded ${extras.favored ? (darkMode ? 'bg-purple-700 text-white' : 'bg-purple-500 text-white') : unselectedBtnClass}`}>
                    Favored Foe ({diceStr(settings.extras.favored)})
                  </button>
                  <button onClick={() => toggleExtra('poison')}
                    className={`px-3 py-2 rounded ${extras.poison ? poisonSelectedClass : unselectedBtnClass}`}>
                    Poison ({diceStr(selectedPoison)})
                  </button>
                </div>

                {extras.poison && (
                  <div className={`mt-3 p-3 rounded flex flex-wrap items-center gap-3 ${darkMode ? 'bg-gray-800' : 'bg-slate-200'}`}>
                    <span className="text-sm font-medium">Poison:</span>
                    <select value={selectedPoison.id} onChange={(e) => setSelectedPoisonId(e.target.value)} className={inputClass}>
                      {settings.poisons.map(p => (
                        <option key={p.id} value={p.id}>{p.name || 'Unnamed Poison'} ({diceStr(p)}, DC {p.dc})</option>
                      ))}
                    </select>
                    <span className="text-sm font-medium">Save:</span>
                    <div className="flex gap-2">
                      <button onClick={() => setPoisonSave('fail')}
                        className={`px-3 py-1 rounded ${poisonSave === 'fail' ? poisonSelectedClass : unselectedBtnClass}`}>
                        Failed
                      </button>
                      <button onClick={() => setPoisonSave('save')}
                        className={`px-3 py-1 rounded ${poisonSave === 'save' ? selectedNeutralClass : unselectedBtnClass}`}>
                        Succeeded
                      </button>
                    </div>
                    <span className={`text-xs ${subtleText}`}>{poisonNote}</span>
                  </div>
                )}
              </div>

              {weapon === 'daggerRapier' ? (
                <div className="space-y-4 mb-6">
                  {hitsHeader}
                  <div className="grid grid-cols-2 gap-4 max-w-xl">
                    <div>
                      <label className={subLabelClass}>Dagger Hits (Total)</label>
                      <div className="flex gap-2">
                        {Array.from({ length: A + 1 }, (_, n) => (
                          <button key={n} onClick={() => { setDaggerTotal(n); setDaggerCrits(Math.min(dCrits, n)); }}
                            className={`px-3 py-1 rounded ${dTotal === n ? selectedHitClass : unselectedBtnClass}`}>
                            {n}
                          </button>
                        ))}
                      </div>
                    </div>
                    <div>
                      <label className={subLabelClass}>Dagger Crits (of those hits)</label>
                      <div className="flex gap-2">
                        {Array.from({ length: dTotal + 1 }, (_, n) => (
                          <button key={n} onClick={() => setDaggerCrits(n)}
                            className={`px-3 py-1 rounded ${dCrits === n ? selectedCritClass : unselectedBtnClass}`}>
                            {n}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                  <div>
                    <label className={subLabelClass}>Rapier (Hits / Crits)</label>
                    {renderHitGroups(
                      dTotal > 0 ? 0 : 1,
                      A + 1 - dTotal,
                      (h, c) => rollDamage(h, c, dTotal - dCrits, dCrits),
                      'Roll (No Rapier)',
                      true
                    )}
                  </div>
                </div>
              ) : isCrossbow ? (
                <div className="mb-6">
                  {hitsHeader}
                  <div className="space-y-4">
                    <div>
                      <label className={subLabelClass}>Bonus Action Rapier ({weaponDice(W.rapier)})</label>
                      <div className="flex gap-2">
                        <button onClick={() => setBonusRapier('none')}
                          className={`px-3 py-1 rounded ${bonusRapier === 'none' ? (darkMode ? 'bg-gray-600 text-white' : 'bg-gray-800 text-white') : unselectedBtnClass}`}>
                          None
                        </button>
                        <button onClick={() => setBonusRapier('hit')}
                          className={`px-3 py-1 rounded ${bonusRapier === 'hit' ? selectedHitClass : unselectedBtnClass}`}>
                          Hit
                        </button>
                        <button onClick={() => setBonusRapier('crit')}
                          className={`px-3 py-1 rounded ${bonusRapier === 'crit' ? selectedCritClass : unselectedBtnClass}`}>
                          Crit
                        </button>
                      </div>
                    </div>
                    <div>
                      <label className={subLabelClass}>{W[weapon].name} (Hits / Crits)</label>
                      {renderHitGroups(
                        bonusRapier !== 'none' ? 0 : 1,
                        A,
                        (h, c) => rollDamage(h, c, 0, 0, bonusRapier),
                        'Roll (Rapier Only)'
                      )}
                    </div>
                  </div>
                </div>
              ) : (
                <div className="mb-6">
                  {hitsHeader}
                  {renderHitGroups(1, A + 1, (h, c) => rollDamage(h, c))}
                </div>
              )}

              {displayAttacks && (
                <div className={cardClass}>
                  <h2 className="text-lg font-semibold mb-2">Results</h2>

                  <div className={`mb-3 p-2 rounded text-sm ${darkMode ? 'bg-gray-700' : 'bg-slate-300'}`}>
                    {getRerollMessage()}
                    {isSelectMode && (
                      <button
                        onClick={handleSkipReroll}
                        className={`ml-2 px-2 py-1 rounded text-xs ${darkMode ? 'bg-gray-600 hover:bg-gray-500' : 'bg-gray-400 hover:bg-gray-500'} text-white`}
                      >
                        Skip Reroll
                      </button>
                    )}
                  </div>

                  <div className="mb-4">
                    {displayAttacks.map((attack, attackIdx) => {
                      const globalStartIndex = displayAttacks.slice(0, attackIdx).reduce((sum, a) => sum + a.dice.length, 0);
                      return (
                        <AttackRow
                          key={attackIdx}
                          attack={attack}
                          rerolledIndex={results?.rerolledIndex ?? -1}
                          originalValue={results?.originalValue ?? 0}
                          globalStartIndex={globalStartIndex}
                          darkMode={darkMode}
                          selectMode={isSelectMode}
                          onSelectDie={handleManualReroll}
                          showStats={isSelectMode}
                        />
                      );
                    })}
                  </div>
                  <div className={`text-right border-t-2 pt-3 ${rowBorder}`}>
                    <div className={`text-3xl font-bold ${color.green}`}>
                      {pendingReroll?.total ?? results?.total} Total Damage
                    </div>
                  </div>
                  <div className={`mt-2 text-xs ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>
                    <span className={color.weapon}>■</span> Weapon
                    <span className={`ml-2 ${color.green}`}>■</span> Sneak/Swarm
                    <span className={`ml-2 ${color.favored}`}>■</span> Favored Foe
                    <span className={`ml-2 ${color.poison}`}>■</span> Poison
                    <span className="ml-2 text-amber-500">■</span> Rerolled
                  </div>
                </div>
              )}

              {rollLog.length > 0 && (
                <div className={`mt-4 ${cardClass}`}>
                  <div className="flex justify-between items-center mb-2">
                    <h2 className="text-lg font-semibold">Roll Log</h2>
                    <button
                      onClick={() => setRollLog([])}
                      className={`px-2 py-1 rounded text-xs ${darkMode ? 'bg-gray-600 hover:bg-gray-500' : 'bg-gray-400 hover:bg-gray-500'} text-white`}
                    >
                      Clear
                    </button>
                  </div>
                  <div className="space-y-2">
                    {rollLog.map((entry, idx) => (
                      <div key={entry.id} className={`flex flex-wrap items-center gap-2 text-sm p-2 rounded ${idx === 0 ? (darkMode ? 'bg-gray-700' : 'bg-slate-300') : ''}`}>
                        <span className={darkMode ? 'text-gray-400' : 'text-gray-500'}>{entry.timestamp}</span>
                        <span className={`font-bold ${color.green}`}>{entry.total} Total</span>
                        <span className={darkMode ? 'text-gray-500' : 'text-gray-400'}>|</span>
                        <span className={color.weapon}>{entry.piercing} Piercing</span>
                        {entry.poison > 0 && (
                          <>
                            <span className={darkMode ? 'text-gray-500' : 'text-gray-400'}>|</span>
                            <span className={color.poison}>{entry.poison} Poison{entry.poisonHalved ? ' (Saved, ½)' : ''}</span>
                          </>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </>
          )}

          {view === 'settings' && (
            <div className="space-y-4">
              <div className={cardClass}>
                <h3 className="text-base font-semibold mb-2">Attacks &amp; Piercer</h3>
                <div className="flex flex-wrap gap-6">
                  {field('Attacks per Attack Action', renderNumberInput(settings.attacksPerAction, v => updateSetting('attacksPerAction', v), { min: 1, max: 4 }))}
                  {field('Auto-Reroll Threshold (%)', renderNumberInput(settings.rerollThreshold, v => updateSetting('rerollThreshold', v), { min: 0, max: 100 }))}
                </div>
                <p className={`text-xs mt-2 ${subtleText}`}>
                  The Rapier loadout adds one bonus action attack (Rapier of Speed). Piercer auto-rerolls when the best die's chance to improve is above the threshold; otherwise you choose. Set it to 100 to always choose manually.
                </p>
              </div>

              <div className={cardClass}>
                <h3 className="text-base font-semibold mb-1">Weapons</h3>
                {Object.entries(settings.weapons).map(([key, wp]) => (
                  <div key={key} className={`flex flex-wrap items-end gap-3 py-2 border-b last:border-b-0 ${rowBorder}`}>
                    <div className="w-36 font-medium pb-1">{wp.name}</div>
                    {field('Damage Die', renderDieSelect(wp.die, v => updateWeapon(key, 'die', v)))}
                    {field('Modifier', renderNumberInput(wp.mod, v => updateWeapon(key, 'mod', v)))}
                    <span className={`pb-1 font-bold ${color.weapon}`}>{weaponDice(wp)}</span>
                  </div>
                ))}
              </div>

              <div className={cardClass}>
                <h3 className="text-base font-semibold mb-1">Extra Damage</h3>
                <p className={`text-xs mb-1 ${subtleText}`}>All piercing, eligible for Piercer, and doubled on a crit.</p>
                {Object.entries(settings.extras).map(([key, cfg]) => (
                  <div key={key} className={`flex flex-wrap items-end gap-3 py-2 border-b last:border-b-0 ${rowBorder}`}>
                    <div className="w-36 font-medium pb-1">{EXTRA_META[key].name}</div>
                    {field('Dice', renderNumberInput(cfg.count, v => updateExtra(key, 'count', v), { min: 0 }))}
                    {field('Die', renderDieSelect(cfg.die, v => updateExtra(key, 'die', v)))}
                    <span className={`pb-1 font-bold ${key === 'favored' ? color.favored : color.green}`}>{diceStr(cfg)}</span>
                  </div>
                ))}
              </div>

              <div className={cardClass}>
                <h3 className="text-base font-semibold mb-1">Poisons</h3>
                <p className={`text-xs mb-1 ${subtleText}`}>Poison damage isn't doubled on a crit and isn't eligible for Piercer.</p>
                {settings.poisons.map(p => (
                  <div key={p.id} className={`flex flex-wrap items-end gap-3 py-2 border-b last:border-b-0 ${rowBorder}`}>
                    {field('Name', (
                      <input type="text" value={p.name} onChange={(e) => updatePoison(p.id, 'name', e.target.value)} className={`${inputClass} w-44`} />
                    ))}
                    {field('Dice', renderNumberInput(p.count, v => updatePoison(p.id, 'count', v), { min: 0 }))}
                    {field('Die', renderDieSelect(p.die, v => updatePoison(p.id, 'die', v)))}
                    {field('Save DC', renderNumberInput(p.dc, v => updatePoison(p.id, 'dc', v), { min: 1 }))}
                    {field('On Successful Save', (
                      <select value={p.onSave} onChange={(e) => updatePoison(p.id, 'onSave', e.target.value)} className={`${inputClass} w-36`}>
                        <option value="none">No damage</option>
                        <option value="half">Half damage</option>
                      </select>
                    ))}
                    <span className={`pb-1 font-bold ${color.poison}`}>{diceStr(p)}</span>
                    <button
                      onClick={() => removePoison(p.id)}
                      disabled={settings.poisons.length <= 1}
                      className={`mb-1 px-2 py-1 rounded text-xs text-white ${darkMode ? 'bg-gray-600 hover:bg-gray-500' : 'bg-gray-400 hover:bg-gray-500'} ${settings.poisons.length <= 1 ? 'opacity-40 cursor-not-allowed' : ''}`}
                    >
                      Remove
                    </button>
                  </div>
                ))}
                <button
                  onClick={addPoison}
                  className={`mt-3 px-3 py-1 rounded text-sm text-white ${darkMode ? 'bg-rose-700 hover:bg-rose-600' : 'bg-pink-500 hover:bg-pink-600'}`}
                >
                  + Add Poison
                </button>
              </div>

              <div className="flex flex-wrap items-center justify-between gap-2">
                <span className={`text-xs ${subtleText}`}>{saveMessage}</span>
                {confirmReset ? (
                  <div className="flex gap-2">
                    <button onClick={resetSettings}
                      className={`px-3 py-1 rounded text-sm text-white ${darkMode ? 'bg-red-800 hover:bg-red-700' : 'bg-red-600 hover:bg-red-700'}`}>
                      Confirm Reset
                    </button>
                    <button onClick={() => setConfirmReset(false)} className={`px-3 py-1 rounded text-sm ${unselectedBtnClass}`}>
                      Cancel
                    </button>
                  </div>
                ) : (
                  <button onClick={() => setConfirmReset(true)} className={`px-3 py-1 rounded text-sm ${unselectedBtnClass}`}>
                    Reset to Defaults
                  </button>
                )}
              </div>
            </div>
          )}

          <footer className={`mt-10 pt-4 border-t flex justify-center gap-2 ${rowBorder}`}>
            <button
              onClick={() => setShowAbout(true)}
              className={`px-3 py-1 rounded text-xs ${unselectedBtnClass} ${darkMode ? 'hover:bg-gray-600' : 'hover:bg-gray-300'}`}
            >
              About
            </button>
          </footer>

          {showAbout && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60" onClick={() => setShowAbout(false)}>
              <div
                role="dialog"
                aria-modal="true"
                aria-labelledby="about-title"
                onClick={(e) => e.stopPropagation()}
                className={`w-full max-w-lg max-h-[85vh] overflow-y-auto rounded-lg border-2 p-5 ${darkMode ? 'bg-gray-800 border-gray-600 text-gray-100' : 'bg-white border-slate-300 text-gray-900'}`}
              >
                <div className="flex justify-between items-start mb-3">
                  <h2 id="about-title" className="text-xl font-bold">About</h2>
                  <button onClick={() => setShowAbout(false)} aria-label="Close" className={`px-2 py-1 rounded text-sm ${unselectedBtnClass}`}>✕</button>
                </div>
                <div className="space-y-3 text-sm">
                  <p>
                    The 5e Piercer Feat Dice Roller rolls a full turn of weapon damage, including extra damage like Sneak Attack and poison, and applies the Piercer feat's reroll for you.
                  </p>
                  <h3 className="font-semibold text-base">How it works</h3>
                  <ul className="list-disc pl-5 space-y-1">
                    <li>Pick a weapon and toggle any extra damage for the turn, then tap the button that matches how many attacks hit and how many were crits.</li>
                    <li>Once-per-turn extra damage is applied to a crit when one lands, so its dice are doubled too.</li>
                    <li>Critical hits double the weapon dice and add Piercer's extra weapon die.</li>
                    <li>Piercer rerolls one piercing damage die per turn. When a reroll is likely to help, the die with the highest expected gain is rerolled automatically; otherwise you pick a die (its odds are shown) or skip. The new roll always stands.</li>
                    <li>Adjust damage values in the Settings tab. Settings are saved in this browser only.</li>
                  </ul>
                  <h3 className="font-semibold text-base">License</h3>
                  <p>
                    Copyright © {APP_INFO.year} {APP_INFO.author}. Released under the BSD 3-Clause License.{' '}
                    {APP_INFO.repoUrl ? (
                      <>See the full license in the <a href={APP_INFO.repoUrl} target="_blank" rel="noopener noreferrer" className="underline">GitHub repository</a>.</>
                    ) : 'See the full license in the project repository.'}
                  </p>
                  <h3 className="font-semibold text-base">Credits</h3>
                  <p>Built with the help of Claude, an AI model made by Anthropic.</p>
                  <p className={`text-xs ${subtleText}`}>
                    Unofficial fan tool. Not affiliated with or endorsed by Wizards of the Coast.
                  </p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PiercerDiceRoller />);
  </script>
</body>
</html>
